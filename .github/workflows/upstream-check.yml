# Check Upstream Updates Workflow
name: Check Upstream Updates

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 UTC 02:00 (北京时间每周一 10:00) 自动检查
  workflow_dispatch:

jobs:
  check-upstream:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release from Codename-11/hermes-relay
        run: |
          UPSTREAM_TAG=$(gh api repos/Codename-11/hermes-relay/releases/latest --jq '.tag_name' 2>/dev/null || echo "unknown")
          LOCAL_VERSION=$(grep -E 'appVersionName\s*=' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          
          echo "Upstream latest release tag: $UPSTREAM_TAG"
          echo "Local current version: v$LOCAL_VERSION"
          
          UPSTREAM_VER="${UPSTREAM_TAG#android-v}"
          UPSTREAM_VER="${UPSTREAM_VER#v}"
          
          if [ "$UPSTREAM_TAG" != "unknown" ] && [ "$UPSTREAM_VER" != "$LOCAL_VERSION" ]; then
            echo "🚀 **检测到上游有新版本更新！**" >> $GITHUB_STEP_SUMMARY
            echo "- 上游最新版本: \`$UPSTREAM_TAG\` (v$UPSTREAM_VER)" >> $GITHUB_STEP_SUMMARY
            echo "- 本地当前版本: \`v$LOCAL_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "请运行 \`python3 scripts/sync-upstream.py\` 进行同步。" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **当前版本已与上游保持同步或领先。**" >> $GITHUB_STEP_SUMMARY
            echo "- 版本状态: 本地 v$LOCAL_VERSION / 上游 $UPSTREAM_TAG" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
