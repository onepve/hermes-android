# Hermes-Relay Android — Single Signed APK Release Pipeline (Cloudflare R2 Direct Publish)
#
# Builds the single clean, signed release APK and publishes it directly to Cloudflare R2 (dl.onepve.com).

name: Hermes-Relay Release

on:
  push:
    tags:
      - "android-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.17.2)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish Release APK to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install boto3

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "HERMES_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build Sideload Release APK
        env:
          HERMES_KEYSTORE_PATH: ${{ env.HERMES_KEYSTORE_PATH }}
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
          HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS }}
          HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleSideloadRelease --no-daemon --stacktrace

      - name: Clean Keystore
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keystore"

      - name: Publish to Cloudflare R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION#android-v}"

          SRC_APK=$(find app/build/outputs/apk -name "*sideload*release*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            SRC_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          fi

          if [ -z "$SRC_APK" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi

          # Extract versionCode from gradle/libs.versions.toml
          VERSION_CODE=$(grep -E 'appVersionCode\s*=' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([0-9]+)".*/\1/')

          python3 scripts/publish_r2.py "$SRC_APK" "$VERSION" "$VERSION_CODE"
