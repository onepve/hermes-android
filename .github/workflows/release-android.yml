# Hermes-Relay Android — Single Signed APK Release Pipeline
#
# Builds the single clean, signed release APK and publishes it to GitHub Releases.

name: Hermes-Relay Release

on:
  push:
    tags:
      - "android-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. android-v1.17.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "HERMES_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build Sideload Release APK
        env:
          HERMES_KEYSTORE_PATH: ${{ env.HERMES_KEYSTORE_PATH }}
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
          HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS }}
          HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleSideloadRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          SRC_APK=$(find app/build/outputs/apk -name "*sideload*release*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            SRC_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          fi

          if [ -z "$SRC_APK" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi

          mkdir -p dist
          FINAL_APK="dist/hermes-relay-${TAG}.apk"
          cp "$SRC_APK" "$FINAL_APK"

          cd dist
          sha256sum "hermes-relay-${TAG}.apk" > "hermes-relay-${TAG}.apk.sha256"
          cd ..

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          gh release create "$TAG" \
            "dist/hermes-relay-${TAG}.apk" \
            "dist/hermes-relay-${TAG}.apk.sha256" \
            --title "Hermes-Relay ${TAG}" \
            --notes "Hermes-Relay 精简纯净正式版 ${TAG}。已剥离离线唤醒模型与无障碍高危权限，内置专属正式签名。"
